<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960">
  <defs>
    <pattern id="d2" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#1e293b"/></pattern>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fef00"/><stop offset="1" stop-color="#9fef00" stop-opacity="0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9fef00" stop-opacity="0.25"/><stop offset="1" stop-color="#9fef00"/></linearGradient>
  </defs>
  <rect width="1280" height="960" fill="#0b121f"/>
  <rect width="1280" height="960" fill="url(#d2)"/>
  <text x="64" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="60" font-weight="700" fill="#ffffff">Automation + Web Dashboard</text>
  <rect x="64" y="176" width="130" height="6" rx="3" fill="#9fef00"/>
  <text x="64" y="228" font-family="'Fira Code',Consolas,monospace" font-size="28" fill="#A4B1CD">Automations that run &#183; a dashboard that shows it live</text>

  <!-- dashboard mock -->
  <rect x="150" y="300" width="980" height="520" rx="18" fill="#141d2b" stroke="#243043" stroke-width="2"/>
  <rect x="150" y="300" width="980" height="70" rx="18" fill="#1a2332"/>
  <circle cx="188" cy="335" r="8" fill="#9fef00"/><text x="212" y="343" font-family="'Segoe UI',system-ui" font-size="24" font-weight="600" fill="#ffffff">Live Operations</text>
  <!-- KPI tiles -->
  <g>
    <rect x="182" y="400" width="270" height="120" rx="12" fill="#1a2332" stroke="#2e3b4f"/>
    <text x="210" y="440" font-family="'Fira Code',monospace" font-size="18" fill="#A4B1CD">LEADS TODAY</text>
    <text x="210" y="492" font-family="'Segoe UI',system-ui" font-size="44" font-weight="700" fill="#9fef00">128</text>
    <rect x="470" y="400" width="270" height="120" rx="12" fill="#1a2332" stroke="#2e3b4f"/>
    <text x="498" y="440" font-family="'Fira Code',monospace" font-size="18" fill="#A4B1CD">RESPONSE TIME</text>
    <text x="498" y="492" font-family="'Segoe UI',system-ui" font-size="44" font-weight="700" fill="#ffffff">2m</text>
    <rect x="758" y="400" width="270" height="120" rx="12" fill="#1a2332" stroke="#2e3b4f"/>
    <text x="786" y="440" font-family="'Fira Code',monospace" font-size="18" fill="#A4B1CD">AUTOMATED</text>
    <text x="786" y="492" font-family="'Segoe UI',system-ui" font-size="44" font-weight="700" fill="#9fef00">94%</text>
  </g>
  <!-- bar chart -->
  <g>
    <rect x="182" y="560" width="846" height="220" rx="12" fill="#1a2332" stroke="#2e3b4f"/>
    <rect x="230" y="700" width="70" height="60" fill="url(#bar)"/>
    <rect x="330" y="660" width="70" height="100" fill="url(#bar)"/>
    <rect x="430" y="620" width="70" height="140" fill="url(#bar)"/>
    <rect x="530" y="640" width="70" height="120" fill="url(#bar)"/>
    <rect x="630" y="600" width="70" height="160" fill="url(#bar)"/>
    <rect x="730" y="580" width="70" height="180" fill="url(#bar)"/>
    <rect x="830" y="610" width="70" height="150" fill="url(#bar)"/>
    <rect x="930" y="590" width="70" height="170" fill="url(#bar)"/>
  </g>
  <text x="640" y="880" text-anchor="middle" font-family="'Fira Code',monospace" font-size="22" fill="#5b6b81">React &#183; n8n &#183; cloud-hosted &#183; mobile-friendly</text>
  <rect x="0" y="952" width="1280" height="8" fill="url(#a2)"/>
