<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="dots3" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e293b"/>
    </pattern>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accentFade3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fef00"/>
      <stop offset="1" stop-color="#9fef00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b121f"/>
  <rect width="1280" height="720" fill="url(#dots3)"/>

  <!-- Title -->
  <text x="64" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff">AI Offer Intake &amp; Recap</text>
  <rect x="64" y="118" width="120" height="6" rx="3" fill="#9fef00"/>
  <text x="64" y="164" font-family="'Fira Code', Consolas, monospace" font-size="26" fill="#A4B1CD">Offer PDF &#8594; structured deal terms &#8594; drafted recap &#183; n8n + OCR</text>

  <!-- Pipeline connections -->
  <g stroke="#3d4a5c" stroke-width="3" fill="none" stroke-dasharray="8 8">
    <path d="M 292 400 L 360 400"/>
    <path d="M 592 400 L 660 400"/>
    <path d="M 896 380 C 950 360 990 330 1032 316"/>
    <path d="M 896 420 C 950 440 990 470 1032 484"/>
  </g>

  <!-- Stage 1: Email in -->
  <g>
    <rect x="96" y="352" width="196" height="96" rx="14" fill="#1a2332" stroke="#2e3b4f" stroke-width="2"/>
    <text x="194" y="392" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="600" fill="#ffffff">Offer arrives</text>
    <text x="194" y="424" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#9fef00">email + PDF</text>
  </g>

  <!-- Stage 2: OCR -->
  <g>
    <rect x="360" y="352" width="232" height="96" rx="14" fill="#1a2332" stroke="#2e3b4f" stroke-width="2"/>
    <text x="476" y="392" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="600" fill="#ffffff">OCR Engine</text>
    <text x="476" y="424" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#9fef00">scanned pages &#8594; text</text>
  </g>

  <!-- Stage 3: AI extraction -->
  <g filter="url(#glow3)">
    <rect x="660" y="340" width="236" height="120" rx="16" fill="#141d2b" stroke="#9fef00" stroke-width="3"/>
  </g>
  <text x="778" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">AI Extraction</text>
  <text x="778" y="424" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#9fef00">price &#183; terms &#183; dates</text>

  <!-- Output: sheet -->
  <g>
    <rect x="1032" y="268" width="184" height="96" rx="14" fill="#1a2332" stroke="#2e3b4f" stroke-width="2"/>
    <text x="1124" y="308" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="600" fill="#ffffff">Deal log</text>
    <text x="1124" y="340" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#9fef00">sheets row</text>
  </g>

  <!-- Output: draft -->
  <g>
    <rect x="1032" y="436" width="184" height="96" rx="14" fill="#1a2332" stroke="#2e3b4f" stroke-width="2"/>
    <text x="1124" y="476" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="600" fill="#ffffff">Recap email</text>
    <text x="1124" y="508" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#9fef00">auto-drafted</text>
  </g>

  <rect x="0" y="712" width="1280" height="8" fill="url(#accentFade3)"/>
</svg>
